name: Auto Update Cyclone News

on:
  schedule:
    - cron: '*/30 * * * *'  # Run every 30 minutes
  workflow_dispatch:        # Allow manual trigger button

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script to fetch news
        run: python fetch_news.py

      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html about.html terms.html privacy.html contact.html
          git commit -m "Auto-update: $(date)" || exit 0
          echo "=== Fetching latest remote changes ==="
          git fetch origin main
          echo "=== Rebasing onto remote main ==="
          git rebase origin/main
          echo "=== Pushing ==="
          git push
